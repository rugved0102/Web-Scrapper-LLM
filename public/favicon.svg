<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <style>
    @media (prefers-color-scheme: dark) {
      .bg { fill: #ffffff; }
      .brain { stroke: #000000; }
    }
    @media (prefers-color-scheme: light) {
      .bg { fill: #000000; }
      .brain { stroke: #ffffff; }
    }
  </style>
  
  <!-- Background circle -->
  <circle cx="50" cy="50" r="45" class="bg"/>
  
  <!-- Brain icon (scaled from lucide-react Brain icon) -->
  <g transform="translate(50, 50) scale(2.5)" class="brain" stroke-width="1.2" fill="none" stroke-linecap="round" stroke-linejoin="round">
    <!-- Left brain hemisphere -->
    <path d="M 0 -8 a 3 3 0 1 0 -6 0.125 a 4 4 0 0 0 -2.5 5.77 a 4 4 0 0 0 0.556 6.588 A 4 4 0 1 0 0 6.5 Z"/>
    
    <!-- Right brain hemisphere -->
    <path d="M 0 -8 a 3 3 0 1 1 6 0.125 a 4 4 0 0 1 2.5 5.77 a 4 4 0 0 1 -0.556 6.588 A 4 4 0 1 1 0 6.5 Z"/>
    
    <!-- Center brain fold -->
    <path d="M 3 1 a 4.5 4.5 0 0 1 -3 -4 a 4.5 4.5 0 0 1 -3 4"/>
    
    <!-- Brain details -->
    <path d="M 5.6 -5.5 a 3 3 0 0 0 0.4 -1.375"/>
    <path d="M -6 -6.875 A 3 3 0 0 0 -5.6 -5.5"/>
    <path d="M -8.5 -1.1 a 4 4 0 0 1 0.585 -0.396"/>
    <path d="M 7.94 -1.5 a 4 4 0 0 1 0.585 0.396"/>
    <path d="M -6 6 a 4 4 0 0 1 -2 -0.516"/>
    <path d="M 8 5.484 A 4 4 0 0 1 6 6"/>
  </g>
</svg>
